plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.jase.goldtrader'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.jase.goldtrader.widget'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
