<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>App closed</title>
<style>html,body{margin:0;height:100%;background:#0f0e0c;color:#a69f90;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}</style>
<script>
/* This app has been closed. Remove anything a team login could have left on this device. */
try { Object.keys(localStorage).filter(k => k.indexOf("dgs:") === 0).forEach(k => localStorage.removeItem(k)); } catch(e){}
try { sessionStorage.clear(); } catch(e){}
try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())); } catch(e){}
</script>
</head><body><p>This app is no longer available.</p></body></html>
