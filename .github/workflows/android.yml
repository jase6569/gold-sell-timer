name: Build Android widget

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      # keep the same signing key between builds so updates install over the top
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gold-trader-signing-key
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Publish APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk gold-trader-widget.apk
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add gold-trader-widget.apk
          git diff --cached --quiet || git commit -m "Build Android widget"
          git pull --rebase -q || true
          git push
