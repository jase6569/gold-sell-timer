name: Update gold data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_data.py
      - run: python scripts/fetch_news.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data.json
          if [ -f news.json ]; then git add news.json; fi
          git diff --cached --quiet || git commit -m "Update gold data"
          git push
