name: Update gold data

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert to every channel"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-gold
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_data.py
      - run: python scripts/fetch_news.py
        continue-on-error: true
      - run: python scripts/notify.py
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_MIKE: ${{ secrets.NTFY_TOPIC_MIKE }}
          TEST_ALERT: ${{ inputs.test_alert }}
      - name: Commit data
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data.json
          for f in news.json state.json widget.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "Update gold data"
          git pull --rebase -q || true
          git push
      - name: Alert if the update failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_MIKE: ${{ secrets.NTFY_TOPIC_MIKE }}
        run: |
          for T in "$NTFY_TOPIC" "$NTFY_TOPIC_MIKE"; do
            [ -n "$T" ] || continue
            curl -s -H "Title: Gold Trader update failed" -H "Priority: high" -H "Tags: warning" \
              -d "The hourly gold price check failed, so sell alerts may be paused until it's fixed. The app still shows the live price." \
              "https://ntfy.sh/$T"
          done
